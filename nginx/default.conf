server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # Reglas de reescritura de .htaccess portadas a Nginx
    location / {
        # Si el archivo o directorio existe, servirlo directamente
        if (-e $request_filename) {
            break;
        }

        # Redirigir rutas dinámicas
        rewrite ^/([^/]+)/([^/]+)/([^/]+)$ /index.php?page=$1&action=$2&id=$3 last;
        rewrite ^/([^/]+)/([^/]+)$ /index.php?page=$1&action=$2 last;
        rewrite ^/([^/]+)$ /index.php?page=$1 last;
        
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesamiento de PHP via FastCGI (PHP-FPM)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Denegar acceso a archivos sensibles
    location ~ /\.(ht|git|env) {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
