services:
  app:
    build:
      context: .
      network: host
    image: condominios-app
    container_name: condominios-app
    restart: always
    volumes:
      - uploads_data:/var/www/html/uploads
    environment:
      - DB_HOST=db # Cambiado a 'db' para comunicación interna
      - DB_BASE=${DB_BASE}
      - DB_USR=${DB_USR}
      - DB_PASS=${DB_PASS}
      - EMAIL_USR=${EMAIL_USR}
      - EMAIL_PASS=${EMAIL_PASS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SITE_URL=${SITE_URL}
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: condominios-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=${DB_BASE}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./config/db.sql:/docker-entrypoint-initdb.d/init.sql:ro

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: condominios-proxy
    restart: always
    ports:
      - "9000:80"
    volumes:
      - uploads_data:/var/www/html/uploads:ro
    depends_on:
      - app

volumes:
  db_data:
  uploads_data:
