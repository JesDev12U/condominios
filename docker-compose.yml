services:
  app:
    build:
      context: .
      network: host
    container_name: condominios-app
    restart: always
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
      - /var/www/html/vendor
    environment:
      - DB_HOST=db # Cambiado a 'db' para comunicación interna
      - DB_BASE=${DB_BASE}
      - DB_USR=${DB_USR}
      - DB_PASS=${DB_PASS}
      - EMAIL_USR=${EMAIL_USR}
      - EMAIL_PASS=${EMAIL_PASS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SITE_URL=${SITE_URL}
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: condominios-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=${DB_BASE}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./config/db.sql:/docker-entrypoint-initdb.d/init.sql:ro

  nginx:
    image: nginx:alpine
    container_name: condominios-proxy
    restart: always
    ports:
      - "9000:80" # Mantenemos el 9000 para tus pruebas locales por ahora
    volumes:
      - .:/var/www/html:ro # Nginx necesita ver los archivos estáticos
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  db_data:
