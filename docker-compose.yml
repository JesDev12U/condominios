services:
  app:
    build: .
    container_name: condominios-app
    ports:
      - "9000:80"
    volumes:
      - .:/var/www/html
      # Ignoramos node_modules y vendor en el volumen para usar los del contenedor
      - /var/www/html/node_modules
      - /var/www/html/vendor
    environment:
      - DB_HOST=${DB_HOST}
      - DB_BASE=${DB_BASE}
      - DB_USR=${DB_USR}
      - DB_PASS=${DB_PASS}
      - EMAIL_USR=${EMAIL_USR}
      - EMAIL_PASS=${EMAIL_PASS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SITE_URL=${SITE_URL}
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: condominios-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=${DB_BASE}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./config/db.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db_data:
